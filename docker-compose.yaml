services:
  db:
    image: postgres:16
    container_name: gitea_database
    restart: always
    env_file: ".env"
    environment:
      - POSTGRES_USER=gitea
      - POSTGRES_PASSWORD=$GITEA_DATABASE
      - POSTGRES_DB=gitea
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./config_postgres:/var/lib/postgresql/data

  git:
    image: gitea/gitea:1.20.5-rootless
    container_name: gitea
    env_file: ".env"
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=$GITEA_DATABASE
      - GITEA__server__START_SSH_SERVER=true
      - GITEA__server__SSH_PORT=2222
    restart: always
    volumes:
      - ./data_gitea:/var/lib/gitea
      - ./config_gitea:/etc/gitea
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "2222:2222"
    depends_on:
      - db
  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    hostname: syncthing
    environment:
      - PUID=1000
      - PGID=1000
    command: --home=/config
    volumes:
      - ./config_syncthing:/config
      - /mnt/private_media:/mnt/private_media
      - /mnt/documents:/mnt/documents
    ports:
       - 8384:8384 # Web UI
       - 22000:22000/tcp # TCP file transfers
       - 22000:22000/udp # QUIC file transfers
       - 21027:21027/udp # Receive local discovery broadcasts
    restart: unless-stopped
